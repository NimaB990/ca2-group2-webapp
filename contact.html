<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Group 02 Cloud Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Group 02 Cloud Showcase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="team.html">Team</a>
            <a href="cloud.html">Cloud</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>
    <main>
        <section class="page-heading">
            <p class="eyebrow">03 / Connect</p>
            <h2>Let’s talk cloud.</h2>
            <p>Have a question about our project or want to share an idea? Send us a message.</p>
        </section>
        <form action="mailto:group02@example.com" method="post" enctype="text/plain">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
            <button class="button" type="submit">Send message</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
